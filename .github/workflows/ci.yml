name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked --target ${{ matrix.target }} --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked --target ${{ matrix.target }}
      - run: cargo +stable test --locked --target ${{ matrix.target }} --release
